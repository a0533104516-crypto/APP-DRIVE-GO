name: Build CarPedia 360 APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: TypeScript diagnostics
        continue-on-error: true
        run: npx tsc --noEmit 2>&1 | tee tsc.log
      - name: Next production build
        run: npm run build 2>&1 | tee next-build.log
      - name: Create clean Android wrapper
        run: rm -rf android && npx cap add android
      - name: Ensure Capacitor Gradle settings
        run: |
          cat > android/capacitor.settings.gradle <<'EOF'
          include ':capacitor-android'
          project(':capacitor-android').projectDir = new File('../node_modules/@capacitor/android/capacitor')
          EOF
      - name: Ensure Capacitor app Gradle settings
        run: |
          touch android/app/capacitor.build.gradle
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build APK
        working-directory: android
        run: set -o pipefail && ./gradlew assembleDebug 2>&1 | tee ../gradle.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CarPedia-360-build-logs
          path: |
            tsc.log
            next-build.log
            gradle.log
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: CarPedia-360-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
