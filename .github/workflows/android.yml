name: Build CarPedia 360 APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: TypeScript diagnostics
        continue-on-error: true
        run: npx tsc --noEmit 2>&1 | tee tsc.log
      - name: Next production build
        run: npm run build 2>&1 | tee next-build.log
      - run: npx cap add android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CarPedia-360-build-logs
          path: |
            tsc.log
            next-build.log
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: CarPedia-360-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
